<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilibili Digest · 字幕笔记</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
  <header class="masthead">
    <div class="eyebrow"><span class="brand-mark" aria-hidden="true">▥</span> BILIBILI DIGEST <span class="edition">个人学习版</span></div>
    <div class="heading-row"><h1>把视频，读成笔记。</h1><button id="settings" class="icon-button" type="button" aria-label="模型设置" title="模型设置">⚙</button></div>
    <p class="intro">字幕里的知识，留在你的手边。</p>
  </header>
  <main>
    <section class="video-card" aria-label="当前视频">
      <div class="card-top"><span class="tiny-label">正在阅读</span><button id="refresh" class="text-button" type="button">重新提取 ↻</button></div>
      <h2 id="videoTitle">打开一个 B 站视频</h2><p id="videoMeta">支持普通 BV 视频和当前分 P</p>
      <p id="sourceLabel" class="source-label"></p>
    </section>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="aiNotice" class="ai-notice">字幕提取无需 AI Key。模型功能可在设置中开启。</div>
    <nav class="tabs" aria-label="学习视图"><button data-tab="transcript" class="active" type="button" aria-pressed="true">字幕 <span id="segmentCount">0</span></button><button data-tab="overview" type="button" aria-pressed="false">概览</button><button data-tab="notes" type="button" aria-pressed="false">笔记 <span id="noteCount">0</span></button></nav>
    <section id="transcriptPanel" class="view">
      <div class="control-row"><label class="compact-label">字幕来源<select id="track" aria-label="字幕来源" disabled></select></label><label class="compact-label">显示<select id="displayMode"><option value="original">原文</option><option value="bilingual">双语对照</option><option value="zh">中文译文</option></select></label></div>
      <div class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="在字幕中找一个词…" aria-label="搜索字幕"><span id="searchCount" class="search-count"></span></div>
      <div class="toolbar"><button id="copyTranscript" type="button" disabled>复制全文</button><div class="export-group"><select id="exportFormat" aria-label="导出格式"><option value="md">Markdown</option><option value="txt">TXT</option><option value="srt">SRT</option></select><button id="exportTranscript" type="button" disabled>导出 ↗</button></div></div>
      <div class="translation-bar"><button id="translate" class="text-button" type="button" disabled>生成中文翻译</button><span id="translationProgress"></span></div>
      <div class="selection-tools"><p id="selectionHint">选中字幕，可以讲解或摘录。</p><div><button id="explainSelection" type="button" disabled>讲解片段</button><button id="noteSelection" type="button" disabled>存为笔记</button></div></div>
      <div id="explanation" class="ai-output" hidden></div>
      <div id="subtitleList" class="subtitle-list"><div class="empty-state"><span class="empty-number">01</span><h3>从一段字幕开始</h3><p>在 B 站打开视频，再点击扩展图标。<br>你可以阅读、搜索，或导出交给 Codex。</p></div></div>
    </section>
    <section id="overviewPanel" class="view" hidden>
      <div class="section-heading"><span class="tiny-label">看见内容的脉络</span><h2>一份可回看的概览</h2><p>整理核心观点、章节与学习要点。只依据字幕，保留时间戳。</p></div>
      <button id="generateSummary" class="primary" type="button" disabled>生成视频概览</button><p id="summaryHint" class="hint"></p>
      <div id="summary" class="ai-output"></div><button id="copySummary" type="button" hidden>复制概览</button>
    </section>
    <section id="notesPanel" class="view" hidden>
      <div class="section-heading"><span class="tiny-label">记住值得留下的</span><h2>这一 P 的学习笔记</h2><p>保存原句，或写下自己的理解。</p></div>
      <label class="field-label" for="noteText">新笔记</label><textarea id="noteText" rows="4" maxlength="10000" placeholder="写下一个想法，或从字幕中摘录…"></textarea>
      <div class="note-form-row"><label class="compact-label">时间（秒）<input id="noteTime" type="number" min="0" max="172800" step="0.001" value="0"></label><button id="useCurrentTime" type="button">取播放时间</button></div>
      <div class="toolbar"><button id="saveNote" class="primary" type="button" disabled>保存笔记</button><button id="polishNote" type="button" disabled>AI 润色</button></div>
      <button id="exportNotes" class="text-button" type="button" disabled>导出这一 P 的笔记 ↗</button><div id="notesList"></div>
    </section>
    <button id="cancelAi" class="cancel" type="button" hidden>停止后续请求</button>
  </main>
  <footer><span>你的字幕 · 你的笔记</span><a href="README.md" target="_blank" rel="noreferrer">使用说明与二创来源 ↗</a></footer>
  <script src="core.js"></script><script src="sidepanel.js"></script>
</body></html>
